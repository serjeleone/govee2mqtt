name: Check prepared release
on:
  push:
    branches: [codex/release-2026-11-17]
permissions:
  contents: read
jobs:
  verify:
    name: Verify source and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format new recovery modules
        run: |
          rustfmt --edition 2021 src/service/dreamview.rs src/service/one_click.rs
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          print('FORMATTED_RECOVERY_MODULES=' + json.dumps({str(p): p.read_text() for p in [Path('src/service/dreamview.rs'), Path('src/service/one_click.rs')]}))
          PYCODE
      - name: Validate release metadata
        env:
          RELEASE_TAG: "2026-11-17"
        run: ./scripts/ci-metadata.sh
      - run: cargo clippy --all-targets --all-features
      - run: cargo build --all
      - run: cargo test --lib -- --show-output
      - run: cargo test --test lan_simulator -- --show-output
      - run: docker pull eclipse-mosquitto:2
      - run: cargo test --test mqtt_integration -- --test-threads=1 --show-output
